<title>Fevio 환자 앱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: patient pane (operable) and partner pane (live mirror) side by side; on phones one pane at a time with a switch. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F4F5F7; --ink:#0E0F11; --ink2:#565A63; --ink3:#8A8E96; --line:#E3E5E9;
  --signal:#1F5BFF; --signal-soft:rgba(31,91,255,.10); --coral:#E5484D; --coral-soft:rgba(229,72,77,.10);
  --on-ink:#FFFFFF; --shadow:0 1px 2px rgba(14,15,17,.06),0 8px 24px rgba(14,15,17,.06);
  --font:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#1A1B1E; --sunk:#232428; --ink:#F2F3F5; --ink2:#B3B6BD; --ink3:#7F838B; --line:#2D2F34;
  --signal:#6A90FF; --signal-soft:rgba(106,144,255,.16); --coral:#FF6B6F; --coral-soft:rgba(255,107,111,.14);
  --on-ink:#0E0F11; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#1A1B1E; --sunk:#232428; --ink:#F2F3F5; --ink2:#B3B6BD; --ink3:#7F838B; --line:#2D2F34;
  --signal:#6A90FF; --signal-soft:rgba(106,144,255,.16); --coral:#FF6B6F; --coral-soft:rgba(255,107,111,.14);
  --on-ink:#0E0F11; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.hatch{background-image:repeating-linear-gradient(135deg,var(--signal-soft) 0 6px,transparent 6px 12px)}
.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{position:relative;height:36px;padding:0 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:4px;background:var(--signal)}
.panes{display:block}
.pane{position:relative;background:var(--bg);min-height:100%}
.pane-label{display:none}
.scroll{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.tabs{display:flex;gap:4px;padding:5px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);width:min(100%,360px)}
.tabs button{flex:1;height:46px;border-radius:19px;font-size:13px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.tabs svg{width:18px;height:18px}
.readonly .tabs{pointer-events:none}
@media (min-width:880px){
  .switch{display:none}
  .panes{display:grid;grid-template-columns:repeat(2,minmax(0,400px));justify-content:center;gap:28px;padding:20px 24px}
  .pane{height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:640px;border-radius:28px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .pane[hidden]{display:block!important}
  .pane-label{display:flex;position:absolute;top:-1px;left:50%;transform:translateX(-50%);z-index:5;height:24px;padding:0 10px;border-radius:0 0 10px 10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);align-items:center;font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .scroll{height:100%;overflow-y:auto;padding-left:16px;padding-right:16px;padding-bottom:110px}
  .tabbar{position:absolute;padding:8px 16px 14px}
}
.head{display:flex;align-items:center;gap:8px;padding-top:30px;padding-bottom:10px}
.head h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em}
.head .sub{font-size:13px;color:var(--ink2);font-weight:500}
.head .sp{flex:1}
.pill{height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.ink{background:var(--ink);color:var(--on-ink)}
.pill.line{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.pill .bd{width:7px;height:7px;border-radius:4px;background:var(--signal)}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.h2{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 4px 2px}
.muted{color:var(--ink3)}
.empty{padding:22px 16px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{font-size:16px}
.empty p{margin:0;color:var(--ink2);font-size:14px}
/* journey */
.journey{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.journey span{height:6px;border-radius:3px;background:var(--line)}
.journey span.done{background:var(--ink)}
.journey span.now{background:var(--signal)}
.now-name{font-size:21px;font-weight:700;margin-top:10px}
.now-sub{font-size:13px;color:var(--ink2)}
/* lines */
.line-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0}
.line-row+.line-row{border-top:1px solid var(--line)}
.line-row.fresh{border-radius:12px;padding-left:8px;padding-right:8px;margin:0 -8px}
.t{width:46px;flex:none;font-weight:700;font-size:15px}
.ln{flex:1;min-width:0}
.ln b{display:block;font-size:15px}
.ln small{display:block;color:var(--ink2);font-size:13px}
.k{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:1px}
.chk{height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.chk.on{background:var(--ink);color:var(--on-ink);box-shadow:none}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:700;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.sig{background:var(--signal-soft);color:var(--signal)}
.next{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.next .card{flex:none;width:150px;padding:12px}
.next .d{font-size:12px;font-weight:700;color:var(--ink2)}
.next b{display:block;font-size:15px;margin-top:2px}
.openrow{padding:12px 14px;border-radius:14px;color:var(--ink);font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1px rgba(31,91,255,.35)}
/* calendar */
.calbar{display:flex;align-items:center;gap:6px;margin:2px 0 8px}
.calbar .wl{height:36px;padding:0 8px;border-radius:12px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center}
.icon-btn svg{width:15px;height:15px}
.day{display:flex;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;text-align:left;width:100%;position:relative}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel:not(.today){box-shadow:inset 0 0 0 2px var(--signal)}
.day.past:not(.sel){opacity:.62}
.dcol{width:34px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.dcol .w{font-size:11px;font-weight:700;color:var(--ink3)}
.dcol .n{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:15px;font-weight:700}
.day.today .n{background:var(--ink);color:var(--on-ink)}
.chips{flex:1;min-width:0;min-height:44px;display:flex;flex-wrap:wrap;align-content:center;gap:6px}
.chip{height:30px;padding:0 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--sunk)}
.chip.visit{background:var(--ink);color:var(--on-ink)}
.chip.proc{background:var(--signal);color:#fff}
.chip.call{box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent}
.chip.done{background:var(--sunk);color:var(--ink3)}
.daybody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.memo-ic{position:absolute;top:10px;right:12px;color:var(--ink3)}
.memo-ic svg{width:13px;height:13px}
.memoline{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:12px;background:var(--sunk);font-size:13px;color:var(--ink2);text-align:left;width:100%}
.memoline svg{width:14px;height:14px;flex:none;margin-top:2px}
.memoline .who{font-weight:700;color:var(--ink)}
.addmemo{align-self:flex-start;height:30px;padding:0 10px;border-radius:15px;font-size:12px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.addmemo svg{width:13px;height:13px}
.memo-ed{display:flex;flex-direction:column;gap:8px}
.memo-ed textarea{width:100%;min-height:64px;resize:vertical;border:0;border-radius:12px;background:var(--sunk);padding:10px 12px;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.toggle i{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-checked="true"] i{background:var(--signal)}
.toggle[aria-checked="true"] i::after{transform:translateX(16px)}
.btn{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:700}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.line{box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{color:var(--ink2)}
.btn.danger{color:var(--coral)}
.native{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;font-size:13px;color:var(--ink2);transition:opacity .5s}
.native .sp{width:34px;flex:none;font-size:10px;font-weight:700;color:var(--ink3);text-align:center}
.native a{color:inherit;text-decoration:none;flex:1;min-width:0;display:flex;flex-direction:column}
.native a b{color:var(--ink);font-weight:600;font-size:13px}
.native .x{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:var(--ink3);flex:none}
.native .x svg{width:12px;height:12px}
.fade{opacity:0}
.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{box-shadow:inset 0 0 0 2px var(--signal),0 0 0 6px var(--signal-soft)}100%{}}
/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;padding:10px 6px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.month .h{font-size:11px;font-weight:700;color:var(--ink3);padding-bottom:6px}
.month button{min-height:54px;padding:4px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.month .mn{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-size:13px;font-weight:700}
.month .mt .mn{background:var(--ink);color:var(--on-ink)}
.month .bar{width:70%;height:5px;border-radius:3px;background:var(--ink)}
.month .bar.proc{background:var(--signal)}
.month .bar.dose{background:var(--line)}
.month .off{opacity:.3}
/* capture */
.overlay{position:absolute;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
@media (max-width:879px){.overlay{position:fixed}}
.ov-in{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto}
.ov-head{display:flex;align-items:center;gap:8px}
.ov-head h2{margin:0;font-size:20px;flex:1}
textarea.memo-in{width:100%;min-height:180px;border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:14px;font-size:15px;line-height:1.6;resize:vertical}
.cand{display:flex;flex-direction:column;gap:8px}
.cand .src{font-size:13px;color:var(--ink2)}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds button{height:30px;padding:0 10px;border-radius:15px;font-size:12px;font-weight:700;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}
.kinds button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
.fields{display:flex;flex-wrap:wrap;gap:6px}
.fields input{height:36px;border:0;border-radius:10px;background:var(--sunk);padding:0 10px;font-size:14px;min-width:0}
.fields input.title{flex:1 1 160px}
.warn{font-size:12px;color:var(--coral);font-weight:600}
.notice{padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:13px;color:var(--ink2)}
/* community */
.topics{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.topics button{height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);color:var(--ink2)}
.topics button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
.post{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.post .who{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunk);color:var(--ink2);flex:none}
.post .meta{color:var(--ink3);font-size:12px}
.post p{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .acts{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
.post .acts button{display:inline-flex;align-items:center;gap:5px}
.post .acts svg{width:16px;height:16px}
.post.ad p{font-size:14px;color:var(--ink2)}
.compose{display:flex;flex-direction:column;gap:8px}
.compose textarea{width:100%;min-height:72px;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:12px;font-size:15px;resize:vertical}
.share-panel{display:flex;flex-direction:column;gap:12px}
.share-panel label{font-size:12px;font-weight:700;color:var(--ink2)}
.share-panel input[type=text]{width:100%;height:40px;border:0;border-radius:12px;background:var(--sunk);padding:0 12px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gate{display:flex;flex-direction:column;gap:12px}
.gate h2{margin:0;font-size:20px}
.gate ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.status{font-size:12px;color:var(--ink3);padding:6px 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="switch" id="switch"></div>
<div class="panes">
  <section class="pane" id="pane-patient" aria-label="환자 화면"><span class="pane-label">환자</span><div id="patient"></div></section>
  <section class="pane readonly" id="pane-partner" aria-label="배우자 화면"><span class="pane-label">배우자 · 보기 전용</span><div id="partner"></div></section>
</div>

<script>
'use strict';
/* ---------- dates ---------- */
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const mondayOf = (d) => { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); x.setHours(0, 0, 0, 0); return x; };
const mdLabel = (s) => { const d = parseYmd(s); return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + DOW[d.getDay()]; };
const hm = (ts) => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- domain: kinds, milestones ---------- */
const KINDS = [
  ['visit', '진료·검사'], ['dose', '투약'], ['trigger', '트리거'], ['retrieval', '채취'],
  ['transfer', '이식'], ['test', '판정'], ['call', '연구실 연락'], ['open', '아직 미정'], ['skip', '저장 안 함']
];
const KLABEL = Object.fromEntries(KINDS);
const MILESTONES = ['주기 시작', '과배란 주사', '트리거', '채취', '수정 · 배양', '이식', '판정'];
const MS_OF = { dose: 1, trigger: 2, retrieval: 3, call: 4, transfer: 5, test: 6 };
const CHIP_CLASS = { visit: 'visit', trigger: 'proc', retrieval: 'proc', transfer: 'proc', test: 'visit', call: 'call', dose: '' };

/* ---------- parser: clinic text -> candidates (pure, deterministic) ---------- */
function guessKind(s) {
  if (/^\s*\[[^\]]*\]|진료\s*뒤\s*계획|안내\s*드립니다$|^안녕/.test(s)) return 'skip';
  if (/미정|정해지|추후|안내\s*예정|결과\s*(보고|를\s*보고)|나중에/.test(s)) return 'open';
  if (/트리거|hcg|오비드렐|난포\s*터/i.test(s)) return 'trigger';
  if (/채취/.test(s)) return 'retrieval';
  if (/이식/.test(s)) return 'transfer';
  if (/판정|임신\s*검사|베타/.test(s)) return 'test';
  if (/연구실|배아|수정\s*확인|배양/.test(s)) return 'call';
  if (/주사|iu|펜|용량|투약|복용|약\b/i.test(s)) return 'dose';
  if (/초음파|피검사|내원|진료|방문|검사|예약/.test(s)) return 'visit';
  return 'skip';
}
function findDate(s, base) {
  let m = s.match(/(\d{1,2})\s*[\/.월]\s*(\d{1,2})\s*일?/);
  if (m) {
    const mo = +m[1], da = +m[2];
    if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) {
      let d = new Date(base.getFullYear(), mo - 1, da);
      if (d < addDays(base, -60)) d = new Date(base.getFullYear() + 1, mo - 1, da);
      return ymd(d);
    }
  }
  m = s.match(/(?:^|[^\d\/.])(\d{1,2})\s*일(?![가-힣]*간)/);
  if (m && +m[1] >= 1 && +m[1] <= 31) { let d = new Date(base.getFullYear(), base.getMonth(), +m[1]); if (d < addDays(base, -7)) d = new Date(base.getFullYear(), base.getMonth() + 1, +m[1]); return ymd(d); }

function rulesOn(day) {

  const covering = S.rules.filter((r) => r.from <= day && (!r.to || r.to >= day)).sort((a, b) => (b.from + b.createdAt).localeCompare(a.from + a.createdAt));
  return covering.length ? [covering[0]] : [];
}
function eventsOn(day) {
  const ev = S.items.filter((x) => x.date === day).map((x) => ({ src: 'item', id: x.id, kind: x.kind, time: x.time || '', title: x.title, detail: x.detail || '', upd: x.createdAt }));
  rulesOn(day).forEach((r) => ev.push({ src: 'rule', id: r.id, kind: 'dose', time: r.time || '', title: r.title || '주사', detail: r.detail || '', upd: r.createdAt }));
  return ev.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}
function currentMilestone() {
  const t = ymd(today());

  let m = 0;
  S.items.forEach((x) => { if (x.date <= t && MS_OF[x.kind] > m) m = MS_OF[x.kind]; });
  S.rules.forEach((r) => { if (r.from <= t && m < 1) m = 1; });
  return m;
}

  const t = ymd(today()), out = [];

    const day = ymd(addDays(today(), i));

  }

}

    case 'mday': { const d = parseYmd(el.dataset.day); U.wk = Math.round((mondayOf(d) - mondayOf(today())) / 6048e5); U.sel = el.dataset.day; U.month = false; render(); break; }
    case 'memo-open': { const day = el.dataset.day, mm = S.memos[day]; U.memo = { day, text: mm ? mm.text : '', shared: mm ? !!mm.shared : false }; render(); setTimeout(() => { const t = document.getElementById('memo-text'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 30); break; }
    case 'memo-share': U.memo.shared = !U.memo.shared; render(); break;
    case 'memo-cancel': U.memo = null; render(); break;
    case 'memo-del': { const day = U.memo.day; U.memo = null; del('memos/' + day); break; }
    case 'memo-save': {
      const m = U.memo, text = m.text.trim().slice(0, 500); U.memo = null;
      if (!text) del('memos/' + m.day); else put('memos/' + m.day, { text, shared: m.shared, updatedAt: Date.now(), seenAt: null });
      render(); break;
    }
    case 'edit': U.edit = !U.edit; render(); break;
    case 'del-ev': del((el.dataset.src === 'rule' ? 'rules/' : 'items/') + el.dataset.id); break;
    case 'dose': { const k = el.dataset.k; if (S.doses[k]) del('doses/' + k); else put('doses/' + k, { at: Date.now(), createdAt: Date.now() }); break; }
    case 'hide-ad': hideAd(el.dataset.id); break;
    case 'topic': U.topic = v; U.adTick++; render(); break;
    case 'post': {
      const text = U.compose.trim().slice(0, 1000); if (!text) return;
      const m = currentMilestone();
      put('posts/p' + Date.now().toString(36), { text, nick: st().nick || '익명', stage: m == null ? '' : MILESTONES[m], topic: U.topic === 'all' ? 'all' : U.topic, likes: 0, createdAt: Date.now() });
      U.compose = ''; render(); break;
    }
    case 'like': { const p = S.posts.find((x) => x.id === el.dataset.id); if (p) put('posts/' + p.id, { likes: (p.likes || 0) + 1 }, true); break; }
  }
}
function saveCapture() {
  const c = U.capture, now = Date.now(); let n = 0;
  c.cands.forEach((x, i) => {
    if (x.kind === 'skip') return;
    const id = c.id + '-' + i, base = { title: (x.title || KLABEL[x.kind]).slice(0, 60), detail: (x.detail || '').slice(0, 80), captureId: c.id, createdAt: now + i };
    if (x.kind === 'dose' && x.end) { S.rules.filter((r) => !r.to || r.to > x.date).forEach((r) => put('rules/' + r.id, { to: x.date, updatedAt: now }, true)); n++; return; }
    if (x.kind === 'open') put('open/' + id, { title: base.title, done: false, captureId: c.id, createdAt: now + i });
    else if (x.kind === 'dose' && x.daily) put('rules/' + id, Object.assign(base, { kind: 'dose', time: x.time, from: x.date, to: x.to || '' }));
    else put('items/' + id, Object.assign(base, { kind: x.kind, date: x.date, time: x.time }));
    n++;
  });
  put('captures/' + c.id, { status: 'confirmed', confirmedAt: now, count: n }, true);
  const first = c.cands.find((x) => x.date && x.kind !== 'skip');
  U.capture = null; if (U.tab === 'plan' && first) { const d = parseYmd(first.date); U.wk = Math.round((mondayOf(d) - mondayOf(today())) / 6048e5); U.sel = first.date; }
  render();
}

/* ---------- boot ---------- */
render();
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { S.offline = true; S.ready = true; applyMem(); return; }
  const colls = ['settings', 'items', 'rules', 'open', 'memos', 'doses', 'posts'];
  let pending = new Set(colls);
  colls.forEach((c) => {
    db.collection(c).onSnapshot((snap) => {
      setColl(c, snap.docs.map((d) => ({ id: d.id, data: d.data() || {} })));
      pending.delete(c); if (!pending.size) S.ready = true;
      render();
    }, () => { pending.delete(c); if (!pending.size) S.ready = true; render(); });
  });
  setTimeout(() => { if (!S.ready) { S.ready = true; render(); } }, 6000);
})();
// Rotate the native rows slowly so the same line doesn't sit there all day.
setInterval(() => { if (document.hidden || U.capture || U.memo || (document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) return; const el = document.getElementById('calad') || document.getElementById('feedad-0'); if (!el) return; el.classList.add('fade'); setTimeout(() => { U.adTick++; render(); }, 500); }, 24000);
</script>
